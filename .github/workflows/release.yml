name: Release

on:
  push:
    branches: [main]

# Release type is inferred from the head commit message tag.
# Recognised tags (matched as substrings):
#   * `[release]`, `[release:patch]`, `[release:fix]`  -> `patch`
#   * `[release:minor]`                                -> `minor`
#   * `[release:major]`                                -> `major`
# The pipeline skips when none is present.
jobs:
  release:
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/release-docker.yml@v2
    with:
      platforms: linux/amd64,linux/arm64,linux/arm/v7
      cargo_zigbuild: 'true'
      rust_targets: |
        x86_64-unknown-linux-musl
        aarch64-unknown-linux-musl
        armv7-unknown-linux-musleabihf
      build_args: |
        BIN_PATH_AMD64=target/x86_64-unknown-linux-musl/release/archanist
        BIN_PATH_ARM64=target/aarch64-unknown-linux-musl/release/archanist
        BIN_PATH_ARMV7=target/armv7-unknown-linux-musleabihf/release/archanist
    permissions:
      contents: write
      packages: write
